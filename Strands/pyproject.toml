[project]
name = "legion-strands"
version = "0.1.0"
description = "Autonomous AI workforce on AWS Strands Agents: deterministic workflow engine plus 13 specialist agents."
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.61",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
legion = "legion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
